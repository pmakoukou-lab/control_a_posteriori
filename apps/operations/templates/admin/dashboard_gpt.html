<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Refactor</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">

<div class="max-w-2xl mx-auto mt-10 bg-white border border-gray-200 rounded-2xl overflow-hidden">

    <!-- Header -->
    <div class="flex items-center justify-center gap-3 px-6 py-5 border-b border-gray-200">
        <h1 class="text-lg font-semibold text-green-700">Create User Account</h1>
    </div>

    <!-- Form -->
    <form class="px-6 py-6 space-y-8">

        <div class="grid md:grid-cols-3 gap-6">
            <div class="text-sm font-semibold text-gray-500 text-right">
                User Information
            </div>

            <div class="md:col-span-2 space-y-5">

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        First Name
                    </label>
                    <input type="text"
                        class="w-full px-4 py-2.5 rounded-xl text-sm
                               bg-white text-gray-900
                               border border-gray-300
                               focus:border-green-700 focus:ring-2 focus:ring-green-700/20
                               outline-none transition-all" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        Last Name
                    </label>
                    <input type="text"
                        class="w-full px-4 py-2.5 rounded-xl text-sm
                               bg-white text-gray-900
                               border border-gray-300
                               focus:border-green-700 focus:ring-2 focus:ring-green-700/20
                               outline-none transition-all" />
                </div>

            </div>
        </div>

    </form>
</div>

<!-- Tabs -->
<div class="flex justify-center mt-10">
    <ul class="flex gap-2 p-2 bg-white border rounded-full">
        <li id="homeTab" class="tab px-4 py-2 rounded-full bg-green-100 text-green-700 cursor-pointer">Users</li>
        <li id="settingTab" class="tab px-4 py-2 rounded-full text-gray-500 cursor-pointer">Groups</li>
    </ul>
</div>

<div id="homeContent" class="tab-content mt-6 text-center">Users content</div>
<div id="settingContent" class="tab-content hidden mt-6 text-center">Groups content</div>

<script>
const tabs = document.querySelectorAll(".tab");
const contents = document.querySelectorAll(".tab-content");

tabs.forEach(tab => {
    tab.addEventListener("click", () => {

        tabs.forEach(t => {
            t.classList.remove("bg-green-100", "text-green-700");
            t.classList.add("text-gray-500");
        });

        tab.classList.add("bg-green-100", "text-green-700");
        tab.classList.remove("text-gray-500");

        contents.forEach(c => c.classList.add("hidden"));

        const target = tab.id.replace("Tab", "Content");
        document.getElementById(target).classList.remove("hidden");
    });
});
</script>

</body>
</html>
